name: Post ready-made Reels

# Posts hand-made videos that were uploaded to the hosting release beforehand. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      listing:
        description: "File in manual/ listing the videos and captions"
        required: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GH_TOKEN: ${{ github.token }}
          LISTING: ${{ inputs.listing }}
        run: python pipeline/post_reel.py --post-files "manual/$LISTING"
      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/history.json "$RUNNER_TEMP/mine.json"
          git checkout -q -- state
          git pull -q --rebase
          python pipeline/merge_state.py "$RUNNER_TEMP/mine.json" state/history.json
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "Update Reel history"
          git push -q
