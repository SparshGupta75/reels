name: Weekly report

on:
  schedule:
    # 03:30 UTC Sunday = 09:00 IST Sunday.
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # newest commit, even if this run waited in a queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Write the report
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          AUTO_POST: ${{ vars.AUTO_POST }}
        run: python pipeline/weekly_report.py

      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Merge into the newest history on GitHub so no other run's entries are lost.
          cp state/history.json "$RUNNER_TEMP/mine.json"
          git checkout -q -- state
          git pull -q --rebase
          python pipeline/merge_state.py "$RUNNER_TEMP/mine.json" state/history.json
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "Update follower history"
          git push -q
