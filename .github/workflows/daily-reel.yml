name: Daily Reel

on:
  schedule:
    # Two Reels a day. Making one takes about an hour, so they post around 12:00 and 18:00 IST.
    - cron: "30 5 * * *"    # 11:00 IST
    - cron: "30 11 * * *"   # 17:00 IST
  workflow_dispatch:
    inputs:
      publish:
        description: "Post to Instagram (off = render only)"
        type: boolean
        default: false
      script_only:
        description: "Only write the script (no video, no post)"
        type: boolean
        default: false
      list_models:
        description: "Only list the Gemini models available"
        type: boolean
        default: false
      reuse_render:
        description: "Skip rendering and use the Reel from the last run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    # The daily schedule only posts once the repository variable AUTO_POST is set to "true".
    if: github.event_name != 'schedule' || vars.AUTO_POST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle requests

      - name: Make the Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: >
          python pipeline/post_reel.py
          ${{ (github.event_name == 'schedule' || inputs.publish) && '--publish' || '' }}
          ${{ inputs.reuse_render && '--reuse-render' || '' }}
          ${{ inputs.script_only && '--script-only' || '' }}
          ${{ inputs.list_models && '--list-models' || '' }}

      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "Update Reel history"
          git pull -q --rebase
          git push -q

      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
