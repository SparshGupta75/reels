name: Daily Reel

on:
  schedule:
    # Three Reels a day, around 11:00, 15:00 and 19:00 IST. The runs are normally started by an
    # outside timer (Google Apps Script) because GitHub's own timer fires hours late or not at
    # all; these are spare tries. The script skips a try when that slot already has a Reel.
    - cron: "7,37 5-6,9-10,13-14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Post to Instagram (off = render only)"
        type: boolean
        default: false
      scheduled:
        description: "Started by an outside timer: skip if this half of the day already has a Reel"
        type: boolean
        default: false
      format:
        description: "Kind of Reel: auto (by time of day), regular, quiz or three"
        type: choice
        options: [auto, regular, quiz, three]
        default: auto
      script_only:
        description: "Only write the script (no video, no post)"
        type: boolean
        default: false
      list_models:
        description: "Only list the Gemini models available"
        type: boolean
        default: false
      reuse_render:
        description: "Skip rendering and use the Reel from the last run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-reel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reel:
    # The daily schedule only posts once the repository variable AUTO_POST is set to "true".
    if: github.event_name != 'schedule' || vars.AUTO_POST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # newest commit, even if this run waited in a queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q kaggle requests

      - name: Make the Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: >
          python pipeline/post_reel.py
          ${{ (github.event_name == 'schedule' || inputs.publish) && '--publish' || '' }}
          ${{ (github.event_name == 'schedule' || inputs.scheduled) && '--scheduled' || '' }}
          ${{ inputs.reuse_render && '--reuse-render' || '' }}
          ${{ inputs.script_only && '--script-only' || '' }}
          ${{ inputs.list_models && '--list-models' || '' }}
          --format ${{ inputs.format || 'auto' }}

      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Merge into the newest history on GitHub so no other run's entries are lost.
          cp state/history.json "$RUNNER_TEMP/mine.json"
          git checkout -q -- state
          git pull -q --rebase
          python pipeline/merge_state.py "$RUNNER_TEMP/mine.json" state/history.json
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "Update Reel history"
          git push -q

      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            out/*.mp4
            out/cover-*.jpg
          if-no-files-found: ignore
          retention-days: 7
